<svg width="48" height="48" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Google Antigravity">
  <rect width="256" height="256" fill="#242938" rx="60"/>
  <defs>
    <linearGradient id="agyGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="agyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stylized Antigravity Prism / Inverted 'A' Glyph -->
  <g transform="translate(128, 128)" filter="url(#agyGlow)">
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="url(#agyGrad)" stroke-width="8" stroke-dasharray="16 10" transform="rotate(-25)"/>
    <!-- Floating Core / Triangle / Inverted Delta -->
    <path d="M 0 -62 L 52 38 L -52 38 Z" fill="none" stroke="url(#agyGrad)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Crossbar of A forming levitation horizon -->
    <line x1="-36" y1="12" x2="36" y2="12" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <!-- Central Pulsing Antigravity Singularity -->
    <circle cx="0" cy="-6" r="14" fill="#22D3EE"/>
    <circle cx="0" cy="-6" r="6" fill="#FFFFFF"/>
  </g>
</svg>
